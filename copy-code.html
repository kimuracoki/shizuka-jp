<!-- Shizuka JP — コードブロックのコピーボタン（HTMLエクスポート用）

  使い方（これだけ / テーマCSSの変更は不要）:
    Typora → 環境設定 → 一般 → 詳細設定 → 「Append in <body/>」に
    このファイルの script タグ全体を貼り付けて、HTMLを書き出す。
    特定のファイルだけに適用したい場合は YAML front matter の append-body-extra でも可。

  仕様:
    - 見た目はすべてJS側のインラインスタイルで指定しているので、
      テーマCSSの版が古くても崩れない（CSS側に .shizuka-copy の定義は不要）。
    - コードブロックの背景の明暗を自動判定して、明るい配色／暗い配色を切り替える。
    - PDFエクスポートでは動作しない（PDFにJS/クリップボードがないため）。印刷時は非表示。
-->
<script>
(function () {
  var RESET_MS = 1800;
  var MSG_COPY = 'コピー', MSG_DONE = 'コピーしました', MSG_FAIL = 'コピーできませんでした';

  var ICON_COPY =
    '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5' +
    'c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 ' +
    '9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>' +
    '<path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 ' +
    '14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25' +
    'h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>';

  var ICON_DONE =
    '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 ' +
    '0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>';

  var PALETTE = {
    light: {
      fg: '#334155', bg: '#ffffff', bd: '#cbd5e1',
      hoverFg: '#2563eb', hoverBg: '#f1f5f9', hoverBd: '#2563eb',
      okFg: '#1d4ed8', okBg: '#dbeafe', okBd: '#2563eb',
      ngFg: '#b91c1c', ngBg: '#fee2e2', ngBd: '#fca5a5',
      shadow: '0 1px 2px rgba(15,23,42,.10)'
    },
    dark: {
      fg: '#e2e8f0', bg: '#334155', bd: '#64748b',
      hoverFg: '#ffffff', hoverBg: '#475569', hoverBd: '#3b82f6',
      okFg: '#bfdbfe', okBg: '#1e3a8a', okBd: '#3b82f6',
      ngFg: '#fecaca', ngBg: '#7f1d1d', ngBd: '#b91c1c',
      shadow: '0 1px 2px rgba(0,0,0,.35)'
    }
  };

  // 背景色をたどって、暗い背景かどうかを判定する
  function isDarkBg(el) {
    for (var node = el; node && node.nodeType === 1; node = node.parentNode) {
      var m = /rgba?\(([^)]+)\)/.exec(getComputedStyle(node).backgroundColor || '');
      if (!m) continue;
      var p = m[1].split(',');
      if (p.length > 3 && parseFloat(p[3]) === 0) continue;   // 透明なら親へ
      var lum = (0.299 * +p[0] + 0.587 * +p[1] + 0.114 * +p[2]) / 255;
      return lum < 0.5;
    }
    return false;
  }

  // CodeMirror 出力（通常のHTMLエクスポート）と pre>code（プレーン出力）の両方に対応
  function codeText(pre) {
    var lines = pre.querySelectorAll('.CodeMirror-line');
    var text;
    if (lines.length) {
      text = Array.prototype.map.call(lines, function (el) { return el.textContent; }).join('\n');
    } else {
      var code = pre.querySelector('code');
      text = (code || pre).textContent;
    }
    return text.replace(/\u200b/g, '').replace(/\s+$/, '');
  }

  // file:// で navigator.clipboard が使えない環境向けのフォールバック付き
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:-9999px;';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    });
  }

  function attach(pre) {
    var text = codeText(pre);
    if (!text) return;

    var c = PALETTE[isDarkBg(pre) ? 'dark' : 'light'];

    // 横スクロールでボタンが流れないよう、pre の外側に包む
    var wrap = document.createElement('div');
    wrap.className = 'shizuka-code-wrap';
    wrap.style.position = 'relative';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'shizuka-copy';
    btn.title = MSG_COPY;
    btn.setAttribute('aria-label', 'コードをコピー');
    btn.innerHTML = ICON_COPY + ICON_DONE;
    // 見た目はすべてインラインで持つ（テーマCSSの版に左右されないため）
    btn.style.cssText =
      'position:absolute;top:8px;right:8px;z-index:9999;' +
      'display:inline-flex;align-items:center;justify-content:center;' +
      'width:30px;height:30px;padding:0;margin:0;opacity:1;' +
      'border-radius:8px;box-shadow:' + c.shadow + ';cursor:pointer;' +
      'font-family:inherit;line-height:1;' +
      'color:' + c.fg + ';background:' + c.bg + ';border:1px solid ' + c.bd + ';' +
      'transition:color .15s ease,background .15s ease,border-color .15s ease;';

    var iconCopy = btn.children[0], iconDone = btn.children[1];
    iconDone.style.display = 'none';

    // 「コピーしました」の吹き出し（ボタンの左側）
    var label = document.createElement('span');
    label.className = 'copy-label';
    label.setAttribute('aria-live', 'polite');
    label.style.cssText =
      'position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);' +
      'padding:.1em .55em;border-radius:6px;font-size:12px;line-height:1.7;' +
      'white-space:nowrap;pointer-events:none;display:none;opacity:1;' +
      'box-shadow:0 1px 3px rgba(0,0,0,.25);';
    btn.appendChild(label);
    wrap.appendChild(btn);

    function paint(fg, bg, bd) {
      btn.style.color = fg;
      btn.style.background = bg;
      btn.style.borderColor = bd;
    }

    var flashing = false;
    btn.addEventListener('mouseenter', function () {
      if (!flashing) paint(c.hoverFg, c.hoverBg, c.hoverBd);
    });
    btn.addEventListener('mouseleave', function () {
      if (!flashing) paint(c.fg, c.bg, c.bd);
    });

    var timer;
    function flash(ok) {
      flashing = true;
      label.textContent = ok ? MSG_DONE : MSG_FAIL;
      label.style.color = '#ffffff';
      label.style.background = ok ? '#2563eb' : '#dc2626';
      label.style.display = 'block';
      iconCopy.style.display = ok ? 'none' : '';
      iconDone.style.display = ok ? '' : 'none';
      paint(ok ? c.okFg : c.ngFg, ok ? c.okBg : c.ngBg, ok ? c.okBd : c.ngBd);
      btn.title = ok ? MSG_DONE : MSG_FAIL;

      clearTimeout(timer);
      timer = setTimeout(function () {
        flashing = false;
        label.style.display = 'none';
        iconCopy.style.display = '';
        iconDone.style.display = 'none';
        paint(c.fg, c.bg, c.bd);
        btn.title = MSG_COPY;
      }, RESET_MS);
    }

    btn.addEventListener('click', function () {
      copy(text).then(function () { flash(true); }, function () { flash(false); });
    });
  }

  function init() {
    // 印刷・PDFではボタンを消す
    var st = document.createElement('style');
    st.textContent = '@media print{.shizuka-copy{display:none !important}}';
    document.head.appendChild(st);

    Array.prototype.forEach.call(
      document.querySelectorAll('#write pre.md-fences'), attach);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
